name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @()
          $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($cmd) { $candidates += $cmd.Source }
          $candidates += @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Unable to locate ISCC.exe. Checked:"
            $candidates | ForEach-Object { Write-Host " - $_" }
            throw "ISCC.exe not found"
          }
          Split-Path -Path $iscc -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using ISCC: $iscc"

      - name: Resolve app version from tag
        shell: pwsh
        run: |
          $rawTag = "${{ github.ref_name }}"
          $appVersion = $rawTag.TrimStart('v')
          if (-not $appVersion) { throw "Invalid tag version: $rawTag" }
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Tag: $rawTag -> AppVersion: $appVersion"

      - name: Build installer
        shell: cmd
        run: Setup\build-installer.bat %APP_VERSION%

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DottoressaIorioInstaller-${{ github.ref_name }}
          path: Setup/Output/DottoressaIorioInstaller.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Setup/Output/DottoressaIorioInstaller.exe
          generate_release_notes: true
