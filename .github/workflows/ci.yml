name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DottoressaIorio.slnx

      - name: Build
        run: dotnet build DottoressaIorio.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test DottoressaIorio.slnx --configuration Release --no-build --verbosity normal --filter "Category!=Integration&Category!=E2E"

      - name: Install Playwright browsers
        run: pwsh DottoressaIorio.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run integration tests (PDF)
        run: dotnet test DottoressaIorio.Services.Tests/DottoressaIorio.Services.Tests.csproj --configuration Release --no-build --verbosity normal --filter "Category=Integration"

      - name: Prepare E2E database
        shell: bash
        run: |
          APP_OUT_DIR="DottoressaIorio.App/"
          mkdir -p "$APP_OUT_DIR"
          cp Demo/app_old.db "$APP_OUT_DIR/app.db"
          rm -f "$APP_OUT_DIR/app.db-shm" "$APP_OUT_DIR/app.db-wal"

      - name: Start app for E2E
        shell: bash
        run: |
          export ASPNETCORE_ENVIRONMENT=Development
          export Authentication__UseNegotiate=false
          nohup dotnet run --project DottoressaIorio.App --configuration Release --no-build > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for app readiness
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -kfsS https://localhost:7013/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"
          cat app.log || true
          exit 1

      - name: Run E2E tests
        env:
          E2E__BaseUrl: https://localhost:7013
          E2E__Headless: true
        run: dotnet test DottoressaIorio.E2E/DottoressaIorio.E2E.csproj --configuration Release --no-build --verbosity normal

      - name: Stop app
        if: always()
        shell: bash
        run: |
          if [[ -f app.pid ]]; then
            kill "$(cat app.pid)" || true
          fi

  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @()
          $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($cmd) { $candidates += $cmd.Source }
          $candidates += @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Unable to locate ISCC.exe. Checked:"
            $candidates | ForEach-Object { Write-Host " - $_" }
            throw "ISCC.exe not found"
          }
          Split-Path -Path $iscc -Parent | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using ISCC: $iscc"

      - name: Build installer
        shell: cmd
        run: Setup\build-installer.bat

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DottoressaIorioInstaller
          path: Setup/Output/DottoressaIorioInstaller.exe
